services:
  brain-home:
    build: .
    restart: unless-stopped
    ports:
      - "3579:3579"
      - "3580:3580"
    volumes:
      - brain-home-data:/app/data
      - hf-cache:/root/.cache/huggingface
    environment:
      BRAIN_NAME: home
      MCP_PORT: 3579
      ARTIFACTS_PORT: 3580
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

