version: 2

builds:
  - main: ./main.go
    binary: brain
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      # Docker image tags use bare semver (standard for OCI images); CLI
      # version stays "v"-prefixed (standard for git tags/Go modules) via
      # main.version — the two intentionally diverge here.
      - -s -w -X main.version={{.Tag}} -X main.defaultImageTag={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "brain_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |
    ---
    **Server image:** `docker pull ghcr.io/bradygerndt/project-brain:{{ .Version }}`
    ([package versions](https://github.com/bradygerndt/project-brain/pkgs/container/project-brain))
