version: 2

builds:
  - main: ./main.go
    binary: brain
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.defaultImageTag=v{{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "brain_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
